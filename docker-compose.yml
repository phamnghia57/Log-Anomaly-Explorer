# Stack deploy day du cho Log Anomaly Explorer - phan "deploy len Web" do
# Nghia phu trach.
#
# Gop toan bo pipeline that: OpenSearch (kho du lieu) + 4 service Python
# (ingestion, demo-app, clustering worker, query-api).
#
# Chay tu THU MUC GOC repo (can Docker + Docker Compose plugin):
#   docker compose up -d --build
#
# Moi cong/ten index/tham so deu doc tu bien moi truong, xem .env.example.
# Tao .env tu file do neu can doi (vd. cong 8000-8002 da bi dich vu khac
# tren may chiem, hoac muon tro vao mot OpenSearch co san thay vi dung
# OpenSearch trong stack nay).
#
# Khac voi ingestion/docker-compose.yml (chi dung OpenSearch, phuc vu dev
# rieng le module ingestion) - file nay la stack DEPLOY day du.

services:
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - "OPENSEARCH_JAVA_OPTS=-Xms${OPENSEARCH_HEAP:-512m} -Xmx${OPENSEARCH_HEAP:-512m}"
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    # KHONG publish port 9200 ra host: day la kho du lieu noi bo, chi
    # ingestion/clustering/query-api (cung mang docker) duoc truy cap.

  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      LOG_INDEX: ${LOG_INDEX:-logs}
      QUARANTINE_INDEX: ${QUARANTINE_INDEX:-logs-quarantine}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      RETENTION_INTERVAL_SECONDS: ${RETENTION_INTERVAL_SECONDS:-3600}
    ports:
      - "${INGESTION_PORT:-8000}:8000"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  jaeger:
    # :latest (khong ghim phien ban cu the): khong co mang tu moi truong dev
    # de xac nhan tag so cu the nao dang ton tai that tren Docker Hub luc nay -
    # doan sai se lam `docker compose up` loi ngay buoc pull. Neu can ghim
    # phien ban cho on dinh lau dai, kiem tra tag that tren Docker Hub roi
    # thay vao day.
    image: jaegertracing/all-in-one:latest
    environment:
      # Nhan OTLP (gRPC :4317, HTTP :4318) truc tiep - khong can OTel Collector
      # rieng, ban Jaeger nay da ho tro OTLP native.
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: memory
      # Gioi han so trace giu trong RAM - VM nho, tranh phinh RAM khong gioi
      # han khi demo chay nhieu ngay (trace cu nhat bi day ra khi day).
      MEMORY_MAX_TRACES: ${JAEGER_MAX_TRACES:-20000}
      # Phuc vu UI duoi tien to "/jaeger" (khop voi route @jaeger trong
      # deploy/Caddyfile) de nut "Xem trace tren Jaeger" cua web/ goi duoc
      # qua HTTPS cung domain voi query-api, khong can mo them port/subdomain.
      QUERY_BASE_PATH: /jaeger
    ports:
      - "${JAEGER_UI_PORT:-16686}:16686"
    restart: unless-stopped
    # Khong co healthcheck rieng: demo-app van chay binh thuong neu Jaeger
    # chua san sang, span chi bi mat (xem BatchSpanProcessor trong
    # demo-app/src/telemetry.py - gui nen theo lo, loi khong lam sap app).

  demo-app:
    build:
      context: .
      dockerfile: demo-app/Dockerfile
    depends_on:
      ingestion:
        condition: service_healthy
    environment:
      INGESTION_URL: http://ingestion:8000/ingest
      # OTLPSpanExporter() trong demo-app/src/telemetry.py khong truyen
      # endpoint tuong minh - tu doc bien chuan nay cua OTel SDK roi tu them
      # "/v1/traces", khop dung OTLP/HTTP receiver cua Jaeger o tren.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    ports:
      - "${DEMO_APP_PORT:-8001}:8001"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8001/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  clustering:
    build:
      context: .
      dockerfile: clustering/Dockerfile
    depends_on:
      ingestion:
        condition: service_healthy
    environment:
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      LOG_INDEX: ${LOG_INDEX:-logs}
      CLUSTER_INDEX: ${CLUSTER_INDEX:-clusters}
      HISTORY_INDEX: ${HISTORY_INDEX:-cluster-history}
      WINDOW_SECONDS: ${WINDOW_SECONDS:-60}
      HISTORY_WINDOWS: ${HISTORY_WINDOWS:-30}
      INGESTION_LAG_SECONDS: ${INGESTION_LAG_SECONDS:-10}
      ANOMALY_THRESHOLD: ${ANOMALY_THRESHOLD:-2.0}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ML_AUGMENT_ENABLED: ${ML_AUGMENT_ENABLED:-true}
    volumes:
      # State cua ML augment (template -> signature dai dien): giu qua restart
      # de cluster_id on dinh, xem clustering/README.md muc "ML augment".
      - clustering-data:/app/clustering/data
    restart: unless-stopped
    # Job nen (khong phai HTTP service) - khong co port/healthcheck.

  query-api:
    build:
      context: .
      dockerfile: query-api/Dockerfile
    depends_on:
      ingestion:
        condition: service_healthy
    environment:
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      LOG_INDEX: ${LOG_INDEX:-logs}
      CLUSTER_INDEX: ${CLUSTER_INDEX:-clusters}
      HISTORY_INDEX: ${HISTORY_INDEX:-cluster-history}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      # Login/query routes bat JWT admin; khong co secret mac dinh. /health public.
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRY_SECONDS: ${JWT_EXPIRY_SECONDS:-3600}
      ADMIN_SEED_USERNAME: ${ADMIN_SEED_USERNAME:-}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
      USERS_INDEX: ${USERS_INDEX:-users}
      # Trace cho chinh query-api (query-api/src/telemetry.py) - de xem endpoint
      # nao cua UI cham tren Jaeger, khong chi co trace cua demo-app.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      # AI Assistant (query-api/src/assistant/) - dung Azure OpenAI (xem
      # .env.example), de trong AZURE_OPENAI_API_KEY thi /assistant/* tra
      # 503, cac endpoint khac khong bi anh huong.
      ASSISTANT_CONVERSATIONS_INDEX: ${ASSISTANT_CONVERSATIONS_INDEX:-assistant-conversations}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_API_VERSION: ${AZURE_OPENAI_API_VERSION:-2024-10-21}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-5-mini}
      ASSISTANT_MAX_TOOL_ROUNDS: ${ASSISTANT_MAX_TOOL_ROUNDS:-5}
      ASSISTANT_MAX_OUTPUT_TOKENS: ${ASSISTANT_MAX_OUTPUT_TOKENS:-1200}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://jp.cloud.langfuse.com}
    ports:
      - "${QUERY_API_PORT:-8002}:8002"
    restart: unless-stopped
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8002/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  gateway:
    # Cong vao HTTPS duy nhat ra Internet - BAT BUOC de frontend deploy tren
    # Vercel goi duoc backend nay (Vercel phuc vu qua HTTPS, trinh duyet chan
    # Mixed Content neu goi sang backend HTTP thuan). Xem deploy/Caddyfile.
    #
    # Dung port 80/443 (ACME HTTP-01 challenge cua Let's Encrypt bat buoc dung
    # dung 2 port nay, khong doi duoc) - neu may chu dang co stack khac cung
    # chiem port nay, phai tat gateway cua stack do truoc (vd.
    # `docker compose stop gateway` trong thu muc stack do) - xem
    # web/README.md muc "Deploy len Vercel".
    image: caddy:2.8-alpine
    depends_on:
      - query-api
      - demo-app
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    environment:
      PUBLIC_ADDRESS: ${PUBLIC_ADDRESS:-:80}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    restart: unless-stopped

volumes:
  opensearch-data:
  clustering-data:
  caddy-data:
