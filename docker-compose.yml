# Stack deploy day du cho Log Anomaly Explorer - phan "deploy len Web" do
# Nghia phu trach.
#
# Gop toan bo pipeline that: OpenSearch (kho du lieu) + 4 service Python
# (ingestion, demo-app, clustering worker, query-api).
#
# Chay tu THU MUC GOC repo (can Docker + Docker Compose plugin):
#   docker compose up -d --build
#
# Moi cong/ten index/tham so deu doc tu bien moi truong, xem .env.example.
# Tao .env tu file do neu can doi (vd. cong 8000-8002 da bi dich vu khac
# tren may chiem, hoac muon tro vao mot OpenSearch co san thay vi dung
# OpenSearch trong stack nay).
#
# Khac voi ingestion/docker-compose.yml (chi dung OpenSearch, phuc vu dev
# rieng le module ingestion) - file nay la stack DEPLOY day du.

# Tran cho log container: mac dinh json-file cua Docker KHONG xoay vong, file
# log cu lon mai den khi het dia -> OpenSearch chuyen index sang read-only o
# muc 95% va moi POST /ingest tra 503. Moi service dung chung anchor nay
# (toi da 3 file x 10MB moi container).
x-logging: &logging
  driver: json-file
  options:
    max-size: "10m"
    max-file: "3"

services:
  opensearch:
    image: opensearchproject/opensearch:2.17.1
    environment:
      - discovery.type=single-node
      - DISABLE_SECURITY_PLUGIN=true
      - DISABLE_INSTALL_DEMO_CONFIG=true
      - "OPENSEARCH_JAVA_OPTS=-Xms${OPENSEARCH_HEAP:-512m} -Xmx${OPENSEARCH_HEAP:-512m}"
      # Snapshot repo kieu "fs" (deploy/backup.sh). OpenSearch CHI doc path.repo
      # luc khoi dong -> doi dong nay phai `docker compose up -d --force-recreate
      # opensearch` (deploy.sh khong dung toi opensearch). Thu muc host phai
      # thuoc UID 1000 (user `opensearch` trong image), neu khong dang ky repo
      # se bao "location is not accessible" - xem runbook muc "Khi mat du lieu".
      - path.repo=/snapshots
    ulimits:
      memlock: { soft: -1, hard: -1 }
      nofile: { soft: 65536, hard: 65536 }
    volumes:
      - opensearch-data:/usr/share/opensearch/data
      - ./backups/os:/snapshots
    healthcheck:
      test: ["CMD-SHELL", "curl -sf http://localhost:9200/_cluster/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 20
    restart: unless-stopped
    logging: *logging
    # KHONG publish port 9200 ra host: day la kho du lieu noi bo, chi
    # ingestion/clustering/query-api (cung mang docker) duoc truy cap.

  ingestion:
    build:
      context: .
      dockerfile: ingestion/Dockerfile
    depends_on:
      opensearch:
        condition: service_healthy
    environment:
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      LOG_INDEX: ${LOG_INDEX:-logs}
      QUARANTINE_INDEX: ${QUARANTINE_INDEX:-logs-quarantine}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      RETENTION_INTERVAL_SECONDS: ${RETENTION_INTERVAL_SECONDS:-3600}
      RETENTION_DROP_LEGACY_INDEX: ${RETENTION_DROP_LEGACY_INDEX:-true}
      INGEST_RATE_LIMIT_RPS: ${INGEST_RATE_LIMIT_RPS:-100}
      INGEST_MAX_BATCH_SIZE: ${INGEST_MAX_BATCH_SIZE:-500}
    ports:
      - "127.0.0.1:${INGESTION_PORT:-8000}:8000"
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8000/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  jaeger-init:
    # Image Jaeger chay bang UID 10001; volume moi can duoc cap quyen truoc.
    # Dung lai image Alpine cua gateway, chi chay mot lan va khong mo port.
    image: caddy:2.8-alpine
    user: "0:0"
    entrypoint: ["/bin/sh", "-ec"]
    command:
      - |
        mkdir -p /badger/data /badger/key
        chown 10001:10001 /badger /badger/data /badger/key
        chmod 0750 /badger /badger/data /badger/key
    volumes:
      - jaeger-data:/badger
    restart: "no"
    logging: *logging

  jaeger:
    # Ghim digest cua image dang chay that tren VM (= tag 1.76.0, push
    # 2025-12-03) de `docker compose up` khong keo ve ban khac bat ky luc nao.
    # Doi phien ban: lay digest moi bang
    #   docker inspect --format '{{index .RepoDigests 0}}' <image:tag>
    image: jaegertracing/all-in-one:1.76.0@sha256:ab6f1a1f0fb49ea08bcd19f6b84f6081d0d44b364b6de148e1798eb5816bacac
    depends_on:
      jaeger-init:
        condition: service_completed_successfully
    environment:
      # Nhan OTLP (gRPC :4317, HTTP :4318) truc tiep - khong can OTel Collector
      # rieng, ban Jaeger nay da ho tro OTLP native.
      COLLECTOR_OTLP_ENABLED: "true"
      SPAN_STORAGE_TYPE: badger
      BADGER_EPHEMERAL: "false"
      BADGER_DIRECTORY_VALUE: /badger/data
      BADGER_DIRECTORY_KEY: /badger/key
      # Luu span tren disk, mac dinh 7 ngay; van can giam sat dung luong volume.
      BADGER_SPAN_STORE_TTL: ${JAEGER_TRACE_TTL:-168h}
      # Phuc vu UI duoi tien to "/jaeger" (khop voi route @jaeger trong
      # deploy/Caddyfile) de nut "Xem trace tren Jaeger" cua web/ goi duoc
      # qua HTTPS cung domain voi query-api, khong can mo them port/subdomain.
      QUERY_BASE_PATH: /jaeger
    volumes:
      - jaeger-data:/badger
    ports:
      - "127.0.0.1:${JAEGER_UI_PORT:-16686}:16686"
    restart: unless-stopped
    logging: *logging
    # Khong co healthcheck rieng: demo-app van chay binh thuong neu Jaeger
    # chua san sang, span chi bi mat (xem BatchSpanProcessor trong
    # demo-app/src/telemetry.py - gui nen theo lo, loi khong lam sap app).

  demo-app:
    build:
      context: .
      dockerfile: demo-app/Dockerfile
    depends_on:
      ingestion:
        condition: service_healthy
    environment:
      INGESTION_URL: http://ingestion:8000/ingest
      # OTLPSpanExporter() trong demo-app/src/telemetry.py khong truyen
      # endpoint tuong minh - tu doc bien chuan nay cua OTel SDK roi tu them
      # "/v1/traces", khop dung OTLP/HTTP receiver cua Jaeger o tren.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
    ports:
      - "127.0.0.1:${DEMO_APP_PORT:-8001}:8001"
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8001/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  clustering:
    build:
      context: .
      dockerfile: clustering/Dockerfile
    depends_on:
      ingestion:
        condition: service_healthy
    environment:
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      LOG_INDEX: ${LOG_INDEX:-logs}
      CLUSTER_INDEX: ${CLUSTER_INDEX:-clusters}
      HISTORY_INDEX: ${HISTORY_INDEX:-cluster-history}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      WINDOW_SECONDS: ${WINDOW_SECONDS:-60}
      HISTORY_WINDOWS: ${HISTORY_WINDOWS:-30}
      INGESTION_LAG_SECONDS: ${INGESTION_LAG_SECONDS:-10}
      ANOMALY_THRESHOLD: ${ANOMALY_THRESHOLD:-3.0}
      ALERT_WEBHOOK_URL: ${ALERT_WEBHOOK_URL:-}
      ALERT_COOLDOWN_SECONDS: ${ALERT_COOLDOWN_SECONDS:-600}
      ALERT_WEB_BASE_URL: ${ALERT_WEB_BASE_URL:-}
      HEALTHCHECK_PING_URL: ${HEALTHCHECK_PING_URL:-}
      ML_AUGMENT_ENABLED: ${ML_AUGMENT_ENABLED:-true}
      ML_SIMILARITY_THRESHOLD: ${ML_SIMILARITY_THRESHOLD:-0.9}
      # File state TF-IDF (tuong doi so voi /app). Doi tam thoi khi do error
      # storm (load-tests/run_worker_storm.sh) de template cua log tai gia
      # khong lan vao state that -> cluster_id that khong bi doi.
      ML_STATE_PATH: ${ML_STATE_PATH:-clustering/data/ml_templates.json}
    volumes:
      # State cua ML augment (template -> signature dai dien): giu qua restart
      # de cluster_id on dinh, xem clustering/README.md muc "ML augment".
      - clustering-data:/app/clustering/data
    restart: unless-stopped
    logging: *logging
    # Job nen (khong phai HTTP service) - khong co port/healthcheck.

  query-api:
    build:
      context: .
      dockerfile: query-api/Dockerfile
      args:
        GIT_SHA: ${GIT_SHA:-unknown}
    depends_on:
      ingestion:
        condition: service_healthy
    environment:
      OPENSEARCH_URL: ${OPENSEARCH_URL:-http://opensearch:9200}
      LOG_INDEX: ${LOG_INDEX:-logs}
      CLUSTER_INDEX: ${CLUSTER_INDEX:-clusters}
      HISTORY_INDEX: ${HISTORY_INDEX:-cluster-history}
      RETENTION_DAYS: ${RETENTION_DAYS:-30}
      WINDOW_SECONDS: ${WINDOW_SECONDS:-60}
      # Chi de AI Assistant NOI dung nguong dang ap dung (assistant/config.py
      # ANOMALY_THRESHOLD_HINT) - phai khop gia tri truyen cho `clustering` o
      # tren, neu khong AI se noi mot nguong khac voi nguong that dang chay.
      ANOMALY_THRESHOLD: ${ANOMALY_THRESHOLD:-3.0}
      # Login/query routes bat JWT admin; khong co secret mac dinh. /health public.
      JWT_SECRET: ${JWT_SECRET:-}
      JWT_EXPIRY_SECONDS: ${JWT_EXPIRY_SECONDS:-900}
      AUTH_REFRESH_TTL_SECONDS: ${AUTH_REFRESH_TTL_SECONDS:-604800}
      AUTH_SESSIONS_INDEX: ${AUTH_SESSIONS_INDEX:-auth-sessions}
      AUTH_LOGIN_LIMIT_INDEX: ${AUTH_LOGIN_LIMIT_INDEX:-auth-login-limits}
      AUTH_LOGIN_MAX_ATTEMPTS: ${AUTH_LOGIN_MAX_ATTEMPTS:-5}
      AUTH_LOGIN_WINDOW_SECONDS: ${AUTH_LOGIN_WINDOW_SECONDS:-300}
      AUTH_LOGIN_LOCK_SECONDS: ${AUTH_LOGIN_LOCK_SECONDS:-300}
      AUTH_COOKIE_SECURE: ${AUTH_COOKIE_SECURE:-true}
      AUTH_ALLOWED_ORIGINS: ${AUTH_ALLOWED_ORIGINS:-http://localhost:5173,http://127.0.0.1:5173}
      ADMIN_SEED_USERNAME: ${ADMIN_SEED_USERNAME:-}
      ADMIN_SEED_PASSWORD: ${ADMIN_SEED_PASSWORD:-}
      USERS_INDEX: ${USERS_INDEX:-users}
      # Trace cho chinh query-api (query-api/src/telemetry.py) - de xem endpoint
      # nao cua UI cham tren Jaeger, khong chi co trace cua demo-app.
      OTEL_EXPORTER_OTLP_ENDPOINT: ${OTEL_EXPORTER_OTLP_ENDPOINT:-http://jaeger:4318}
      JAEGER_QUERY_URL: ${JAEGER_QUERY_URL:-}
      # AI Assistant (query-api/src/assistant/) - dung Azure OpenAI (xem
      # .env.example), de trong AZURE_OPENAI_API_KEY thi /assistant/* tra
      # 503, cac endpoint khac khong bi anh huong.
      ASSISTANT_CONVERSATIONS_INDEX: ${ASSISTANT_CONVERSATIONS_INDEX:-assistant-conversations}
      AZURE_OPENAI_API_KEY: ${AZURE_OPENAI_API_KEY:-}
      AZURE_OPENAI_ENDPOINT: ${AZURE_OPENAI_ENDPOINT:-}
      AZURE_OPENAI_DEPLOYMENT: ${AZURE_OPENAI_DEPLOYMENT:-gpt-5-mini}
      AZURE_OPENAI_TIMEOUT_SECONDS: ${AZURE_OPENAI_TIMEOUT_SECONDS:-60}
      ASSISTANT_REASONING_EFFORT: ${ASSISTANT_REASONING_EFFORT:-low}
      ASSISTANT_MAX_TOOL_ROUNDS: ${ASSISTANT_MAX_TOOL_ROUNDS:-2}
      ASSISTANT_MAX_OUTPUT_TOKENS: ${ASSISTANT_MAX_OUTPUT_TOKENS:-1200}
      ASSISTANT_MAX_HISTORY_MESSAGES: ${ASSISTANT_MAX_HISTORY_MESSAGES:-20}
      ASSISTANT_RETENTION_DAYS: ${ASSISTANT_RETENTION_DAYS:-30}
      ASSISTANT_RETENTION_INTERVAL_SECONDS: ${ASSISTANT_RETENTION_INTERVAL_SECONDS:-86400}
      LANGFUSE_PUBLIC_KEY: ${LANGFUSE_PUBLIC_KEY:-}
      LANGFUSE_SECRET_KEY: ${LANGFUSE_SECRET_KEY:-}
      LANGFUSE_BASE_URL: ${LANGFUSE_BASE_URL:-https://jp.cloud.langfuse.com}
    ports:
      - "127.0.0.1:${QUERY_API_PORT:-8002}:8002"
    restart: unless-stopped
    logging: *logging
    healthcheck:
      test: ["CMD-SHELL", "python -c \"import urllib.request as u; u.urlopen('http://localhost:8002/health')\""]
      interval: 15s
      timeout: 5s
      retries: 5

  gateway:
    # Cong vao HTTPS duy nhat ra Internet - BAT BUOC de frontend deploy tren
    # Vercel goi duoc backend nay (Vercel phuc vu qua HTTPS, trinh duyet chan
    # Mixed Content neu goi sang backend HTTP thuan). Xem deploy/Caddyfile.
    #
    # Dung port 80/443 (ACME HTTP-01 challenge cua Let's Encrypt bat buoc dung
    # dung 2 port nay, khong doi duoc) - neu may chu dang co stack khac cung
    # chiem port nay, phai tat gateway cua stack do truoc (vd.
    # `docker compose stop gateway` trong thu muc stack do) - xem
    # web/README.md muc "Deploy len Vercel".
    image: caddy:2.8-alpine
    depends_on:
      - query-api
      - demo-app
    volumes:
      - ./deploy/Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy-data:/data
    environment:
      PUBLIC_ADDRESS: ${PUBLIC_ADDRESS:-:80}
      CORS_WEB_ORIGIN: ${CORS_WEB_ORIGIN:-http://localhost:5173}
      GATEWAY_BASIC_AUTH_USER: ${GATEWAY_BASIC_AUTH_USER:-}
      GATEWAY_BASIC_AUTH_HASH: ${GATEWAY_BASIC_AUTH_HASH:-}
    ports:
      - "80:80"
      - "443:443"
      - "443:443/udp"
    restart: unless-stopped
    logging: *logging

volumes:
  opensearch-data:
  clustering-data:
  caddy-data:
  jaeger-data:
