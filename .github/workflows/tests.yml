# CI: chay test tu dong cho moi module khi co Pull Request vao main.
#
# Vi sao chay RIENG tung module (mot job cho moi module) thay vi mot lenh
# pytest chung cho ca repo:
#   1. Dung voi kien truc hien tai - moi module co requirements.txt rieng
#      (xem README.md goc), job nay chi cai dung phu thuoc cua module do.
#   2. Tranh dung ten module: demo-app va ingestion deu co package ten "src".
#      Chay chung mot tien trinh pytest se khien Python nho nham "src" cua
#      module nay sang module kia (da do thuc te: ingestion/tests bi import
#      nham demo-app/src/main.py). Moi job la mot tien trinh rieng nen khong
#      bao gio dung nhau.
#
# Module chua co thu muc tests/ se duoc BO QUA (khong bao fail), de nguoi
# chua viet test kip khong bi chan merge.
#
# Frontend (web/) co job RIENG o duoi: no la project Node/Vite, khong dung
# requirements.txt nen khong nhet duoc vao matrix Python o tren.

name: tests

on:
  pull_request:
  push:
    branches: [main]

jobs:
  test:
    name: test ${{ matrix.module }}
    runs-on: ubuntu-latest
    strategy:
      # fail-fast: false de mot module hong khong huy ket qua cac module con lai
      fail-fast: false
      matrix:
        module: [demo-app, ingestion, clustering, query-api, load-tests]

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip

      - name: Kiem tra module co test chua
        id: check
        run: |
          if compgen -G "${{ matrix.module }}/tests/test_*.py" > /dev/null; then
            echo "has_tests=true" >> "$GITHUB_OUTPUT"
          else
            echo "has_tests=false" >> "$GITHUB_OUTPUT"
            echo "::notice title=Bo qua::${{ matrix.module }} chua co test nao trong tests/"
          fi
        shell: bash

      - name: Cai dependencies
        if: steps.check.outputs.has_tests == 'true'
        working-directory: ${{ matrix.module }}
        run: |
          python -m pip install --upgrade pip
          if [ -f requirements-dev.txt ]; then
            pip install -r requirements-dev.txt
          else
            # Chua co requirements-dev.txt: cai phu thuoc chinh + pytest
            pip install -r requirements.txt pytest
          fi

      - name: Chay pytest
        if: steps.check.outputs.has_tests == 'true'
        working-directory: ${{ matrix.module }}
        run: python -m pytest -v

  web:
    name: test web
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json

      - name: Cai dependencies
        working-directory: web
        # `npm ci` (khong phai `npm install`): cai dung theo package-lock.json,
        # khong tu nang version - CI va may ca nhan chay cung bo thu vien.
        run: npm ci

      - name: Lint
        working-directory: web
        run: npm run lint

      # `npm run build` = `tsc -b && vite build`: kiem tra type VA build that.
      # Day la dung lenh Vercel chay khi deploy, nen build do day la build vo
      # tren Vercel.
      - name: Kiem tra type + build
        working-directory: web
        run: npm run build

      - name: Chay vitest
        working-directory: web
        run: npm test

  auth-integration:
    name: auth with real OpenSearch and browser
    runs-on: ubuntu-latest
    services:
      opensearch:
        image: opensearchproject/opensearch:2.17.1
        env:
          discovery.type: single-node
          node.store.allow_mmap: "false"
          DISABLE_SECURITY_PLUGIN: "true"
          DISABLE_INSTALL_DEMO_CONFIG: "true"
          OPENSEARCH_JAVA_OPTS: -Xms512m -Xmx512m
        ports:
          - 9200:9200
        options: >-
          --health-cmd "curl -fsS http://localhost:9200/_cluster/health"
          --health-interval 10s --health-timeout 5s --health-retries 30
    env:
      AUTH_TEST_OPENSEARCH_URL: http://127.0.0.1:9200
      AUTH_E2E_OPENSEARCH_URL: http://127.0.0.1:9200
      OTEL_EXPORTER_OTLP_ENDPOINT: ""
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: pip
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
          cache-dependency-path: web/package-lock.json
      - name: Install backend dependencies
        run: pip install -r query-api/requirements-dev.txt
      - name: Verify real storage, persistence and CAS
        working-directory: query-api
        run: python -m pytest tests/test_live_auth_sessions.py tests/test_live_incidents.py -v
      - name: Install browser dependencies
        working-directory: web
        run: |
          npm ci
          npx playwright install --with-deps chromium
      - name: Verify browser and proxy against real OpenSearch
        working-directory: web
        run: npm run test:auth-integration -- --reporter=line
      - name: Verify browser and proxy with mock storage
        working-directory: web
        env:
          AUTH_E2E_OPENSEARCH_URL: ""
        run: npm run test:auth-integration -- --reporter=line
      - name: Verify existing dashboard, incident and navigation flows
        working-directory: web
        run: npm run test:system-integration -- --reporter=line
